name: Vitest (PR to develop)

on:
    pull_request:
        branches:
            - develop
        types:
            - opened
            - synchronize
            - reopened

jobs:
    vitest:
        name: Run vitest on service
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.8.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run vitest
              run: pnpm --filter @skillnavi/service test
